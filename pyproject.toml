[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stickytasks"
version = "1.0.0"
description = "A docked, colour-coded task panel with rich-text notes and review reporting"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PySide6>=6.5"]

[project.optional-dependencies]
dev = ["pytest>=7", "pyflakes"]

[project.gui-scripts]
stickytasks = "stickytasks.app:main"

[tool.setuptools.packages.find]
include = ["stickytasks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:stickytasks.*"]
